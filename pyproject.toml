[project]
name = "house-state"
version = "0.1.0"
description = "House modes, scenes and overlays for Home Assistant"
requires-python = ">=3.13"
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
target-version = "py313"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
