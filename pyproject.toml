[project]
name = "house-state"
version = "0.1.0"
description = "Configurable house state trees, scenes and overlays for Home Assistant"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "mvheimburg" }]
requires-python = ">=3.13"
[project.urls]
Homepage = "https://github.com/mvheimburg/house-state"
Issues = "https://github.com/mvheimburg/house-state/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
target-version = "py313"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
